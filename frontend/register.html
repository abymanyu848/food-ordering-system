<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="register"><header data-site-header></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">Join the table</p><h1>Make room for good food.</h1><p class="muted">Create a customer account to order, track and review.</p><form id="register-form" class="stack-form" novalidate>
<div class="field"><label for="register-full-name">Full name <span class="required-mark" aria-hidden="true">*</span></label><input id="register-full-name" name="full_name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Enter your full name" aria-describedby="full-name-error"><small class="field-hint">Use at least 2 characters.</small><small id="full-name-error" class="field-error" role="alert"></small></div>
<div class="field"><label for="register-email">Email <span class="required-mark" aria-hidden="true">*</span></label><input id="register-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" aria-describedby="email-error"><small id="email-error" class="field-error" role="alert"></small></div>
<div class="field"><label for="register-phone">Phone Number <span class="required-mark" aria-hidden="true">*</span></label><input id="register-phone" name="phone" type="tel" inputmode="numeric" required pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="tel" placeholder="9876543210" aria-describedby="phone-hint phone-error"><small id="phone-hint" class="field-hint">Enter a 10-digit mobile number.</small><small id="phone-error" class="field-error" role="alert"></small></div>
<div class="field"><label for="register-password">Password <span class="required-mark" aria-hidden="true">*</span></label><div class="password-control"><input id="register-password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Create a password" aria-describedby="password-hint password-error"><button class="password-toggle" type="button" data-password-toggle="register-password" aria-label="Show password" aria-pressed="false">Show</button></div><small id="password-hint" class="field-hint">Use at least 8 characters.</small><small id="password-error" class="field-error" role="alert"></small></div>
<div class="field"><label for="register-confirm-password">Re-enter Password <span class="required-mark" aria-hidden="true">*</span></label><div class="password-control"><input id="register-confirm-password" name="confirm_password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Re-enter your password" aria-describedby="confirm-password-error"><button class="password-toggle" type="button" data-password-toggle="register-confirm-password" aria-label="Show password" aria-pressed="false">Show</button></div><small id="confirm-password-error" class="field-error" role="alert"></small></div>
<button class="button button-primary" type="submit">Create account</button><div class="form-message" data-form-message role="status" aria-live="polite"></div></form><p class="auth-foot">Already registered? <a href="/login.html">Sign in</a></p></section></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
