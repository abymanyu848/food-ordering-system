<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Browse dishes · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="foods"><header data-site-header></header><main class="page-shell page-main"><div class="page-intro"><p class="eyebrow">The menu is open</p><h1>Find your next favourite.</h1><p class="lede">Filter by restaurant, price or mood. Add a dish and make it yours.</p></div><div class="filter-panel"><label class="search-bar"><span class="search-mark">⌕</span><input id="food-search" type="search" placeholder="Search dishes"></label><select id="food-restaurant" aria-label="Restaurant"><option value="">All restaurants</option></select><select id="food-category" aria-label="Category"><option value="">All categories</option></select><select id="food-sort" aria-label="Sort dishes"><option value="name">Name</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select><button class="button button-dark" id="food-filter" type="button">Apply filters</button></div><div class="card-grid food-grid" id="food-grid"><div class="loading-state">Loading dishes…</div></div></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
