<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery dashboard · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="delivery-dashboard"><header data-site-header></header><main class="page-shell page-main"><div class="dashboard-intro"><div><p class="eyebrow">On the road</p><h1>Delivery dashboard.</h1><p class="lede">Pick up, move fast, arrive with care.</p></div><span class="role-tag">DELIVERY</span></div><div class="dashboard-grid"><section class="panel"><h2>Delivery profile</h2><form id="delivery-profile-form" class="stack-form"><label>Phone<input name="phone" required></label><label>Vehicle type<input name="vehicle_type" required></label><label>Vehicle number<input name="vehicle_number" required></label><label class="check-row"><input name="is_available" type="checkbox"> Available for deliveries</label><button class="button button-primary" type="submit">Save profile</button><div class="form-message" data-form-message></div></form></section><section class="panel panel-wide"><div class="section-heading tight"><div><p class="eyebrow">Your route</p><h2>Assigned orders</h2></div><button class="button button-dark" id="delivery-refresh" type="button">Refresh</button></div><div id="delivery-orders" class="stack-list"><div class="loading-state">Loading deliveries…</div></div></section><section class="panel panel-wide"><div class="section-heading tight"><h2>Ready for pickup</h2></div><div id="available-orders" class="stack-list"><div class="loading-state">Loading available orders…</div></div></section></div></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
