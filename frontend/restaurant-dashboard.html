<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restaurant dashboard · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="restaurant-dashboard"><header data-site-header></header><main class="page-shell page-main"><div class="dashboard-intro"><div><p class="eyebrow">Kitchen control</p><h1>Restaurant dashboard.</h1><p class="lede">Keep your menu sharp and every order moving.</p></div><span class="role-tag">RESTAURANT</span></div><div class="dashboard-grid"><section class="panel"><div class="section-heading tight"><h2>Restaurant information</h2></div><form id="restaurant-profile-form" class="stack-form"><label>Name<input name="name" required></label><label>Description<textarea name="description" required></textarea></label><label>Address<input name="address" required></label><label>Phone<input name="phone" required></label><div class="form-pair"><label>Opens<input name="opening_time" type="time" required></label><label>Closes<input name="closing_time" type="time" required></label></div><button class="button button-primary" type="submit">Save restaurant</button><div class="form-message" data-form-message></div></form></section><section class="panel panel-wide"><div class="section-heading tight"><div><p class="eyebrow">The pass</p><h2>Incoming orders</h2></div><select id="restaurant-order-status" aria-label="Filter order status"><option value="">All statuses</option><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="preparing">Preparing</option><option value="ready">Ready</option></select></div><div id="restaurant-orders" class="stack-list"><div class="loading-state">Loading orders…</div></div></section><section class="panel panel-wide"><div class="section-heading tight"><h2>Menu items</h2><button class="button button-dark" id="show-food-form" type="button">Add dish</button></div><form id="restaurant-food-form" class="stack-form hidden"><input type="hidden" name="id"><input type="hidden" name="image"><label>Dish name<input name="name" required></label><label>Description<textarea name="description" required></textarea></label><div class="form-pair"><label>Category<select name="category_id" required></select></label><label>Price<input name="price" type="number" min="1" step="0.01" required></label></div><label>Dish image<input name="image_file" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="check-row"><input name="is_available" type="checkbox" checked> Available to order</label><button class="button button-primary" type="submit">Save dish</button><div class="form-message" data-form-message></div></form><div id="restaurant-foods" class="table-wrap"><div class="loading-state">Loading menu…</div></div></section></div></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
