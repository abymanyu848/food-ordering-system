<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your profile · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="profile"><header data-site-header></header><main class="page-shell page-main"><div class="page-intro compact"><p class="eyebrow">The details behind the delivery</p><h1>Profile.</h1></div><div class="profile-layout"><section class="panel"><h2>Personal details</h2><form id="profile-form" class="stack-form"><label>Full name<input name="full_name" required minlength="2"></label><label>Phone<input name="phone" required pattern="[6-9][0-9]{9}"></label><button class="button button-primary" type="submit">Save profile</button><div class="form-message" data-form-message></div></form></section><section class="panel"><div class="section-heading tight"><h2>Saved addresses</h2></div><form id="address-form" class="stack-form inline-form"><input name="address_line" placeholder="Address line" required minlength="5"><input name="city" placeholder="City" required><input name="state" placeholder="State" required><input name="pincode" placeholder="Pincode" required pattern="[0-9]{6}"><button class="button button-dark" type="submit">Add address</button></form><div id="address-list" class="address-list"></div></section></div></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
