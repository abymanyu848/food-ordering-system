<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="admin-dashboard"><header data-site-header></header><main class="page-shell page-main"><div class="dashboard-intro"><div><p class="eyebrow">The big picture</p><h1>Admin dashboard.</h1><p class="lede">A quiet view of the whole operation.</p></div><span class="role-tag">ADMIN</span></div><div id="admin-metrics" class="metric-grid"><div class="loading-state">Loading reports…</div></div><div class="dashboard-grid admin-grid"><section class="panel panel-wide"><div class="section-heading tight"><h2>Orders & delivery assignment</h2><button class="button button-dark" id="admin-refresh" type="button">Refresh</button></div><div id="admin-orders" class="table-wrap"><div class="loading-state">Loading orders…</div></div></section><section class="panel"><h2>Categories</h2><form id="category-form" class="inline-form"><input name="name" placeholder="New category" required minlength="2"><button class="button button-primary" type="submit">Add</button></form><div id="admin-categories" class="stack-list"></div></section><section class="panel"><h2>Delivery people</h2><div id="admin-delivery" class="stack-list"><div class="loading-state">Loading delivery people…</div></div></section><section class="panel panel-wide"><h2>Users</h2><div id="admin-users" class="table-wrap"><div class="loading-state">Loading users…</div></div></section><section class="panel panel-wide"><div class="section-heading tight"><h2>Foods</h2><button class="button button-primary button-small" id="admin-show-food-form" type="button">Add dish</button></div><form id="admin-food-form" class="stack-form hidden"><input type="hidden" name="id"><input type="hidden" name="image"><label>Dish name<input name="name" required minlength="2"></label><label>Description<textarea name="description" required minlength="2"></textarea></label><div class="form-pair"><label>Category<select name="category_id" required></select></label><label>Price<input name="price" type="number" min="1" step="0.01" required></label></div><label>Restaurant<select name="restaurant_id" required></select></label><label>Dish image<input name="image_file" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="check-row"><input name="is_available" type="checkbox" checked> Available to order</label><button class="button button-primary" type="submit">Save dish</button><div class="form-message" data-form-message></div></form><div id="admin-foods" class="table-wrap"><div class="loading-state">Loading dishes…</div></div></section><section class="panel panel-wide"><h2>Restaurants</h2><div id="admin-restaurants" class="table-wrap"><div class="loading-state">Loading restaurants…</div></div></section></div></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
