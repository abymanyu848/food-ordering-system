<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · CraveCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="login"><header data-site-header></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">Welcome back</p><h1>Your table is waiting.</h1><p class="muted">Sign in to pick up where you left off.</p><form id="login-form" class="stack-form"><div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="login-password">Password</label><div class="password-control"><input id="login-password" name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Enter your password"><button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password" aria-pressed="false">Show</button></div></div><button class="button button-primary" type="submit">Sign in</button><div class="form-message" data-form-message role="status" aria-live="polite"></div></form><p class="auth-foot">New here? <a href="/register.html">Create an account</a></p><div class="demo-note"><strong>Demo accounts</strong><span>Customer: john@example.com / password123</span><span>Admin: admin@example.com / admin123</span></div></section></main><footer data-site-footer></footer><div data-toast-region></div><script src="/js/app.js" defer></script></body></html>
